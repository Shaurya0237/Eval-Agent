# Indian criminal law: factual questions with exact answers.
#
# The Bharatiya Nyaya Sanhita, 2023 (BNS) replaced the Indian Penal Code (IPC) on 1 July 2024.
# Every expected answer below was checked against the official BNS text (fixtures/statute/bns-2023.txt);
# the comment on each task names the section it comes from. IPC → BNS pairs follow the official
# correspondence (BPR&D) and were checked by reading the BNS section's content.
#
# Task kinds (tags in the id prefix):
#   sec-*   which BNS section covers a situation          (tests knowledge / retrieval)
#   pun-*   maximum or minimum punishment                  (tests precise recall / retrieval)
#   map-*   which BNS section replaced an IPC section      (tests the IPC → BNS transition)
#   now-*   "under the law in force today" traps           (tests whether the agent knows IPC is repealed)
#
# Answers are JSON so they can be checked exactly; numbers are section numbers without sub-sections.
id: indian-criminal-law
name: Indian criminal law (BNS 2023)
description: Section lookups, punishments and the IPC → BNS transition, checked against the official Act.
groups:
  sec: Which section applies?
  pun: What is the punishment?
  map: Which BNS section replaced this IPC section?
  now: Which law applies today?

tasks:
  # ── Which section? ────────────────────────────────────────────────────────
  - id: sec-murder # BNS 103(1)
    prompt: >-
      Under the Bharatiya Nyaya Sanhita, 2023, which section prescribes the punishment for murder?
      If you can read files, the full Act is in bns-2023.txt in your working directory.
      Reply with ONLY a JSON object: {"section": number}
    fixtures: fixtures/statute
    checks:
      - id: section
        type: answer_json
        expect: { section: 103 }
    processChecks: [tool_errors, hit_turn_limit]

  - id: sec-mob-lynching # BNS 103(2)
    prompt: >-
      Under the Bharatiya Nyaya Sanhita, 2023, a group of five or more people acting together kills a man
